<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <style>
            .cool-paragraph {
            background-color: rgba(174, 232, 171, 0.9);
            border-left: 5px solid #4CAF50;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.2em;
            line-height: 1.5;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .cool-paragraph:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="alert alert-dark col-md-6" align="center" style="padding: 5px; margin: auto; background-color: grey;">
                    <img src="front black porsche.webp" style="height:350px; width:650px" class="img-thumbnail">
                </div>
                <div class="alert alert-dark col-md-6" align="center" style="padding: 5px; margin: auto; background-color: grey;">
                    <img src="front red porshe.webp" style="height:350px; width:650px" class="img-thumbnail">
                </div><br>
            </div>
            <div class="row">
                <div class="alert alert-dark col-md-6" align="center" style="padding: 5px; margin: auto ;background-color: grey;">
                    <img src="front white porsche.webp" style="height:350px; width:650px" class="img-thumbnail">
                </div>  
                <div class="alert alert-dark col-md-6" align="center" style="padding: 5px; margin: auto; background-color: grey;" >
                    <img src="front yellow porsche.webp" style="height:350px; width:650px" class="img-thumbnail">
                </div>
            </div>
        </div>
        <div id="carouselone" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#carouselone" data-bs-slide-to="0" class="active" ></button>
              <button type="button" data-bs-target="#carouselone" data-bs-slide-to="1" ></button>
              <button type="button" data-bs-target="#carouselone" data-bs-slide-to="2" ></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="white,18- inch boxter wheel.webp" class="d-block" style="width:100%">
                <div class="carousel-caption">
                    <h3>porsche in white</h3>
                    <p>classic 718 cayman</p>
                </div>
              </div>
              <div class="carousel-item">
                <img src="porsche white interior 1.webp" class="d-block" style="width:100%">
                <div class="carousel-caption">
                    <h3>seats</h3>
                    <p>white/black</p>
                </div>
              </div>
              <div class="carousel-item">
                <img src="white interior 2.webp" class="d-block" style="width:100%">
                <div class="carousel-caption">
                    <h3>dashboard</h3>
                    <p>standard</p>
                </div>
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselone" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselone" data-bs-slide="next">
              <span class="carousel-control-next-icon" ></span>

            </button>
        </div>
        <div class="container">
            <p class="cool-paragraph">
                porsche in off white is no less then a grasefull moon
            </p>
        </div>
    </body>
</html>
